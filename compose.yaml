services:
  pi-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "30141"
      PI_WEB_HOSTNAME: 0.0.0.0
      PI_WEB_NO_OPEN: "1"
      PI_CODING_AGENT_DIR: /home/node/.pi/agent
      PI_WEB_PASSWORD: ${PI_WEB_PASSWORD:?Set PI_WEB_PASSWORD in .env}
      PI_WEB_ALLOWED_HOSTS: ${PI_WEB_ALLOWED_HOSTS:-}
      PI_WEB_SKIP_VERSION_CHECK: "1"
    ports:
      - "127.0.0.1:${PI_WEB_PORT:-30141}:30141"
    volumes:
      - pi-agent-data:/home/node/.pi/agent
      - pi-cwd-data:/home/node/pi-cwd
      - ${WORKSPACE_DIR:-./workspace}:${WORKSPACE_CONTAINER_DIR:-/workspace}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:30141').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  pi-agent-data:
  pi-cwd-data:
