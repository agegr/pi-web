version: "3.9"

services:
  z-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: zackdk/z-ai:latest
    container_name: z-ai
    ports:
      # 宿主机端口 : 容器端口
      - "30141:30141"
    volumes:
      # 宿主机目录              : 容器内目录
      - /path/to/your/data:/home/piweb/.pi/agent
    environment:
      - PORT=30141
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  pi-agent-data:
