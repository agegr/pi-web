version: "3.9"

services:
  pi-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: z-ai:latest
    container_name: pi-web
    ports:
      - "30141:30141"
    volumes:
      - pi-agent-data:/home/piweb/.pi/agent
    environment:
      - PORT=30141
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  pi-agent-data:
