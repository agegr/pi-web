name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Start dev server
        run: npm run dev -- -H 127.0.0.1 -p 3100 &
      - name: Wait for server
        run: timeout 120 bash -c 'until curl -sf http://127.0.0.1:3100; do sleep 2; done'
      - name: Run E2E (all user journeys)
        run: |
          node e2e/run.mjs
          node e2e/j0-shell-nav.spec.mjs
          node e2e/j1-session-lifecycle.spec.mjs
          node e2e/j2-dialogue.spec.mjs
          node e2e/j3-model-agent.spec.mjs
          node e2e/j4-files-project.spec.mjs
          node e2e/j5-settings-ops.spec.mjs
