<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>pi-web — Server Settings</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(16px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom));
    }
    header { padding: 4px 0 12px; font-weight: 600; color: var(--muted); }
    main { flex: 1; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
    input {
      width: 100%;
      padding: 12px 12px;
      font: 15px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .hint { margin-top: 10px; color: var(--muted); font-size: 13px; }
    .error { margin-top: 8px; color: var(--error); font-size: 13px; min-height: 20px; }
    footer { display: flex; justify-content: flex-end; gap: 10px; padding-top: 14px; }
  </style>
</head>
<body>
  <header>pi-web server URL</header>
  <main>
    <label for="server-url">Server URL</label>
    <input id="server-url" type="text" inputmode="url" spellcheck="false" autocomplete="off"
           placeholder="https://192.168.1.20:30141" />
    <p class="hint">Address of your self-hosted pi-web server, e.g. https://192.168.1.20:30141
       (the machine running `npm run dev`, reachable from this phone).</p>
    <p class="error" id="error" role="alert"></p>
  </main>
  <footer>
    <button id="save" class="primary">Save</button>
  </footer>

  <script>
    (function () {
      // This page is hosted natively (never by the pi-web server), so it
      // persists through the shell's settings seam. Two hosts exist:
      //
      //  - Android: a dedicated SettingsActivity exposes window.piwebSettings
      //    (load()/save()/allowCleartext()) — the same contract as the Electron
      //    desktop shell's preload seam.
      //  - iOS: the main Capacitor webview hosts the page and the injected
      //    runtime is always present (no origin gate), so storage goes through
      //    the official Preferences plugin and the shell is told to reload via
      //    window.webkit.messageHandlers.piwebShell.
      //
      // Both hosts write the exact storage @capacitor/preferences uses, so
      // the value is portable between the plugin and the native readers.
      var KEY = 'piweb.serverUrl'
      var input = document.getElementById('server-url')
      var errorEl = document.getElementById('error')
      var saveBtn = document.getElementById('save')

      function URL_RE() { return /^https?:\/\/[^\s/]+(:\d+)?(\/\S*)?$/i }

      function allowCleartext() {
        if (window.piwebSettings && window.piwebSettings.allowCleartext) {
          return window.piwebSettings.allowCleartext()
        }
        if (window.PiWebShell && typeof window.PiWebShell.allowCleartext === 'boolean') {
          return window.PiWebShell.allowCleartext
        }
        return false
      }

      function preferencesPlugin() {
        var cap = window.Capacitor
        if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return null
        if (!cap.Plugins || !cap.Plugins.Preferences) {
          if (typeof cap.registerPlugin !== 'function') return null
          cap.registerPlugin('Preferences', {})
        }
        return cap.Plugins && cap.Plugins.Preferences
      }

      function loadStored(cb) {
        if (window.piwebSettings) { cb(window.piwebSettings.load()); return }
        var preferences = preferencesPlugin()
        if (preferences) {
          preferences.get({ key: KEY }).then(function (result) { cb(result && result.value) })
          return
        }
        cb(null)
      }

      function validate(value) {
        var trimmed = (value || '').trim()
        if (!trimmed) return 'Enter the pi-web server URL.'
        if (!URL_RE().test(trimmed)) return 'URL must start with http:// or https://'
        if (/^http:\/\//i.test(trimmed) && !allowCleartext()) {
          return 'Cleartext http:// URLs are refused in secure builds. Use https://, or build with PI_WEB_ALLOW_CLEARTEXT=1 for local testing.'
        }
        return ''
      }

      loadStored(function (url) {
        if (url) input.value = url
        else if (window.piwebSettings && window.piwebSettings.defaultUrl) {
          input.value = window.piwebSettings.defaultUrl()
        }
        input.focus()
        input.select()
      })

      input.addEventListener('input', function () { errorEl.textContent = '' })
      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') saveBtn.click()
      })

      saveBtn.addEventListener('click', function () {
        var value = input.value.trim()
        var problem = validate(value)
        if (problem) { errorEl.textContent = problem; return }
        saveBtn.disabled = true
        try {
          if (window.piwebSettings) {
            var result = window.piwebSettings.save(value)
            // The Android @JavascriptInterface bridge returns a Java boolean
            // (true on success, false on validation failure) — it marshals to
            // JS true/false with no .ok property. Treat only an explicit
            // failure as an error; a bare true must not fall into the error
            // branch (pi#31 review fix).
            var saveFailed = !(result === true ||
              (result && typeof result === 'object' && result.ok === true))
            if (saveFailed) {
              errorEl.textContent = (result && result.error) || 'Could not save the URL.'
              saveBtn.disabled = false
            }
            return // the native host reloads the shell itself
          }
          var preferences = preferencesPlugin()
          if (preferences) {
            preferences.set({ key: KEY, value: value }).then(function () {
              if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.piwebShell) {
                window.webkit.messageHandlers.piwebShell.postMessage({ type: 'applyServerUrl', serverUrl: value })
                return // the shell replaces the view controller and reloads
              }
              // Fallback for a Capacitor host without the shell handler
              // (e.g. previewing inside the local server): navigate there.
              window.location.href = value
            }, function () {
              errorEl.textContent = 'Could not save the URL.'
              saveBtn.disabled = false
            })
            return
          }
          errorEl.textContent = 'Settings storage is unavailable in this host.'
          saveBtn.disabled = false
        } catch (e) {
          errorEl.textContent = 'Could not save the URL.'
          saveBtn.disabled = false
        }
      })
    })()
  </script>
</body>
</html>
